name: Publish to npm

# Publishing is a manual step, run from a maintainer's machine:
#   npm ci && npm test && npm run build && npm publish --otp=<code>
# The npm account requires 2FA on publish, which CI cannot satisfy, and an
# automatic release on every push to main gave no chance to choose a dist-tag.
# This workflow stays available on demand for the test/build gate.
on:
  workflow_dispatch:
    inputs:
      publish:
        description: 'Run npm publish after the tests (requires a 2FA-exempt NPM_TOKEN)'
        type: boolean
        default: false

permissions:
  contents: write
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Ensure the full history is available

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'
          registry-url: 'https://registry.npmjs.org/'

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Build package
        run: npm run build

      - name: Publish to npm
        if: ${{ inputs.publish }}
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: npm publish
